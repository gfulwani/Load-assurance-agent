---
applications:
  - name: load-assurance-agent
    memory: 256M
    disk_quota: 512M
    instances: 1
    buildpacks:
      - nodejs_buildpack
    command: npm start
    path: .
    random-route: true
    health-check-type: http
    health-check-http-endpoint: /
    health-check-invocation-timeout: 120
    timeout: 120
    env:
      NODE_ENV: production
      SUPERVISOR_EMAIL: geeta.fulwani@sap.com
    services:
      - connect-lite
      - destination-lite
      - default_aicore
