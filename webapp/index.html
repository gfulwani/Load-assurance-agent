<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Load Assurance Agent</title>

    <!--
        SAP UI5 bootstrap from the CDN.
        Replace the version tag with a fixed version (e.g. 1.120.x) for
        production deployments; use the "latest" alias only during development.

        Theme:      sap_horizon  (SAP Horizon — the default Fiori 3 Next theme)
        Libraries:  sap.m, sap.uxap, sap.ui.layout, sap.f are declared here
                    so the bootstrap pre-loads them in parallel.  The manifest
                    also declares them, which ensures they are loaded even when
                    the app is embedded in a Fiori launchpad.
    -->
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{
            "com.loadassurance.agent": "./"
        }'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
        data-sap-ui-libs="sap.m,sap.uxap,sap.ui.layout,sap.f"
        data-sap-ui-logLevel="warning">
    </script>
</head>
<body class="sapUiBody" id="content">
    <!--
        Declarative component support: sap/ui/core/ComponentSupport scans for
        this element and bootstraps the Component automatically.

        data-sap-ui-component          — marker attribute
        data-name                      — component name (must match Component.js location)
        data-settings                  — JSON-encoded settings passed to UIComponent constructor
        data-handle-validation         — let the framework show validation messages automatically
    -->
    <div
        data-sap-ui-component
        data-name="com.loadassurance.agent"
        data-id="container"
        data-settings='{"id" : "loadAssuranceAgent"}'
        data-handle-validation="true"
        style="height:100%">
    </div>
</body>
</html>
